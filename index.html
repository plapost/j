<style>
:root{
  --bg:#03050a;
  --card:rgba(255,255,255,.075);
  --card2:rgba(255,255,255,.035);
  --stroke:rgba(255,255,255,.14);
  --text:#f7f3e8;
  --muted:#b8b2a2;
  --gold:#d8b76a;
  --gold2:#f3df9e;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family: Inter, Arial, sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 18% 18%, rgba(216,183,106,.16), transparent 28%),
    radial-gradient(circle at 82% 76%, rgba(120,70,255,.12), transparent 32%),
    linear-gradient(135deg,#03050a 0%,#080b14 42%,#111420 100%);
}

.hero{
  width:100%;
  max-width:940px;
  padding:68px 48px calc(120px + env(safe-area-inset-bottom));
  text-align:center;
  border-radius:36px;
  border:1px solid var(--stroke);
  background:
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
  backdrop-filter:blur(22px);
  box-shadow:0 40px 120px rgba(0,0,0,.6);
}

.label{
  display:inline-block;
  padding:10px 16px;
  margin-bottom:20px;
  border-radius:999px;
  border:1px solid rgba(216,183,106,.3);
  color:var(--gold2);
  font-size:12px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

h1{
  font-size:clamp(36px,6vw,70px);
  margin-bottom:20px;
}

h1 span{
  background:linear-gradient(135deg,#fff,#d8b76a);
  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  color:var(--muted);
  margin-bottom:30px;
  line-height:1.6;
}

.meta{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:40px;
}

.meta span{
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  font-size:13px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:68px;
  padding:0 34px;
  border-radius:999px;
  font-weight:800;
  font-size:17px;
  color:#111;
  background:linear-gradient(135deg,#fff3bd,#d8b76a,#9e7428);
  box-shadow:0 20px 50px rgba(216,183,106,.3);
  transition:.3s;
  margin-top:12px;
}

.btn:hover{
  transform:translateY(-3px);
}

.trust{
  margin-top:22px;
  font-size:13px;
  color:rgba(255,255,255,.45);
}

@media(max-width:640px){
  .hero{
    padding:42px 20px calc(130px + env(safe-area-inset-bottom));
  }

  .btn{
    width:100%;
  }
}

<body>

<section class="hero">

  <h1>

    Премиальная атмосфера, честная игра и международное комьюнити.
  </p>

  <div class="meta">
    <span>Texas Hold’em</span>
    <span>Omaha</span>
    <span>Онлайн турниры</span>
    <span>Приватный доступ</span>
  </div>

  <a id="telegramBtn"
     class="btn"
     href="https://t.me/+d-jmDT0COWcyMTNi"
     target="_blank">
    Перейти в Telegram →
  </a>

  <div class="trust">
    Доступ по приглашению · Международное комьюнити
  </div>

</section>

<script>
document.getElementById("telegramBtn").addEventListener("click", function(){

});
</script>
